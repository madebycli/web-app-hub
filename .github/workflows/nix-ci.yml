name: Nix CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      - name: Verify committed lock file
        run: |
          set -euo pipefail
          nix flake lock
          git diff --exit-code -- flake.lock

      - name: Evaluate and test Flake
        run: |
          set -euo pipefail
          nix flake show --no-write-lock-file
          nix flake check --no-write-lock-file --print-build-logs

      - name: Build native package
        run: |
          set -euo pipefail
          nix build .#web-app-hub --no-write-lock-file --print-build-logs
          test -x ./result/bin/web-app-hub
          test -f ./result/share/applications/org.pvermeer.WebAppHub.desktop
          test -f ./result/share/icons/hicolor/256x256/apps/org.pvermeer.WebAppHub.png

      - name: Verify direct GitHub profile install
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIRECT_PROFILE: ${{ runner.temp }}/web-app-hub-profile
        run: |
          set -euo pipefail
          nix profile add --profile "$DIRECT_PROFILE" \
            "github:${GITHUB_REPOSITORY}#web-app-hub"
          test -x "$DIRECT_PROFILE/bin/web-app-hub"
